name: Benchmark CI (Option B)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - benchmark
  push:
    branches:
      - main
      - benchmark

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Continuous Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "stable"

      # 1. Ensure baseline file exists so github-action-benchmark doesn't throw ENOENT on initial run
      - name: Ensure baseline file exists
        run: |
          mkdir -p .github
          if [ ! -f .github/benchmark-baseline.json ] || [ "$(tr -d '[:space:]' < .github/benchmark-baseline.json)" = "{}" ]; then
            echo '{"lastUpdate":0,"repoUrl":"","entries":{"Benchmark":[]}}' > .github/benchmark-baseline.json
          fi

      # 2. Run the 12 suite benchmarks
      - name: Run benchmarks
        run: |
          go test -run=^$ -bench='^(Benchmark_Cache_DoCache_Hit|Benchmark_Cache_DoCache_Miss|Benchmark_Cache_MGetCache|Benchmark_Cache_Invalidation|Benchmark_Parallel_DoMulti|BenchmarkClient_B_Allocation|Benchmark_PubSub_Receive|BenchmarkRESP3WireDecoder_Latency|Benchmark_Ring_Multiplexer_Contention|BenchmarkRingBufferMultiplexer_Contention|Benchmark_ZAdd|BenchmarkCommandBuilder_Allocation)$' \
            -benchmem . ./internal/cmds | tee output.txt

      # 3. Store / Compare results using github-action-benchmark
      - name: Continuous Benchmark Check
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: output.txt
          external-data-json-path: ./.github/benchmark-baseline.json
          skip-fetch-gh-pages: true # Prevents trying to fetch non-existent gh-pages branch
          fail-on-alert: true
          alert-threshold: '130%'   # Alert & fail if regression exceeds +30%
          comment-always: true
          summary-always: true
          save-data-file: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Commit and push updated baseline back to the branch (Push event only)
      - name: Commit & push updated baseline
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/benchmark-baseline.json
          git diff --staged --quiet || (git commit -m "chore: update benchmark baseline [skip ci]" && git push)