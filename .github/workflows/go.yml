name: benchmark
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - benchmark

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Run Go benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "stable"

      - name: Run benchmark
        run: |
          go test -run=^$ -bench='^(Benchmark_Cache_DoCache_Hit|Benchmark_Cache_DoCache_Miss|Benchmark_Cache_MGetCache|Benchmark_Cache_Invalidation|Benchmark_Parallel_DoMulti|BenchmarkClient_B_Allocation|Benchmark_PubSub_Receive|BenchmarkRESP3WireDecoder_Latency|Benchmark_Ring_Multiplexer_Contention|BenchmarkRingBufferMultiplexer_Contention|Benchmark_ZAdd|BenchmarkCommandBuilder_Allocation)$' \
            -benchmem . ./internal/cmds | tee output.txt

      - name: Display Current Benchmark in PR & Job Summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('output.txt', 'utf8');

            const fullSha = context.sha;
            const shortSha = fullSha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${fullSha}`;

            const lines = raw.split('\n');
            const rows = [];
            for (const line of lines) {
              const match = line.match(/^(Benchmark\S+)\s+(\d+)\s+([\d\.]+)\s+ns\/op(?:\s+(\d+)\s+B\/op\s+(\d+)\s+allocs\/op)?/);
              if (match) {
                const [, name, runs, nsOp, bOp, allocsOp] = match;
                // Remove -GOMAXPROCS suffix (e.g., -10) to keep suite name clean like in alert-comment.png
                const suiteName = name.replace(/-\d+$/, '');
                rows.push(`| \`${suiteName}\` | \`${nsOp} ns/op\` | \`${bOp !== undefined ? bOp + ' B/op' : '-'}\` | \`${allocsOp !== undefined ? allocsOp + ' allocs/op' : '-'}\` |`);
              }
            }

            const tableHeader = `| Benchmark suite | Current: ${shortSha} | Memory | Allocations |\n|---|---|---|---|`;
            const table = rows.length > 0 
              ? `${tableHeader}\n${rows.join('\n')}` 
              : 'No benchmarks found in output.';

            const commentHeader = `# 🚀 **Benchmark Results**\n\nBenchmark results for commit [\`${shortSha}\`](${commitUrl}):\n\n`;
            const footer = `\n\n*This comment was automatically generated by [workflow run](${runUrl}) with Continuous Benchmark.*`;
            const details = `\n\n<details>\n<summary>🔍 Raw benchmark output</summary>\n\n\`\`\`text\n${raw}\n\`\`\`\n</details>`;

            const body = `${commentHeader}${table}${details}${footer}`;

            // 1. Add to GitHub Actions Job Summary page
            await core.summary.addRaw(body).write();

            // 2. Post as comment on Pull Request (if triggered by PR)
            if (context.payload.pull_request) {
              const issueNumber = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const botComment = comments.find(c => c.body && c.body.includes('# 🚀 **Benchmark Results**'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body,
                });
              }
            } else if (context.eventName === 'push') {
              // Also post comment on the commit itself when pushing directly to branch
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: fullSha,
                body: body,
              });
            }