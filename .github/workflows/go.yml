name: Benchmark CI (Option B)

on:
  push:
    branches:
      - main
      - benchmark

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Continuous Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "stable"

      # 1. Ensure baseline file exists with required schema
      - name: Ensure baseline file exists
        run: |
          mkdir -p .github
          if [ ! -f .github/benchmark-baseline.json ] || [ "$(tr -d '[:space:]' < .github/benchmark-baseline.json)" = "{}" ]; then
            echo '{"lastUpdate":0,"repoUrl":"","entries":{"Benchmark":[]}}' > .github/benchmark-baseline.json
          fi

      # 2. Run the 12 suite benchmarks on the new commit
      - name: Run benchmarks
        run: |
          go test -run=^$ -bench='^(Benchmark_Cache_DoCache_Hit|Benchmark_Cache_DoCache_Miss|Benchmark_Cache_MGetCache|Benchmark_Cache_Invalidation|Benchmark_Parallel_DoMulti|BenchmarkClient_B_Allocation|Benchmark_PubSub_Receive|BenchmarkRESP3WireDecoder_Latency|Benchmark_Ring_Multiplexer_Contention|BenchmarkRingBufferMultiplexer_Contention|Benchmark_ZAdd|BenchmarkCommandBuilder_Allocation)$' \
            -benchmem . ./internal/cmds | tee output.txt

      # 3. Update benchmark baseline file with github-action-benchmark
      - name: Continuous Benchmark Check & Update
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: output.txt
          external-data-json-path: ./.github/benchmark-baseline.json
          skip-fetch-gh-pages: true
          summary-always: true
          save-data-file: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Post results to the merged PR conversation tab (or commit) & Job Summary
      - name: Post Results to PR Conversation / Commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('output.txt', 'utf8');

            const fullSha = context.sha;
            const shortSha = fullSha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${fullSha}`;

            // Load baseline data to extract main baseline commit and values
            let mainSha = '';
            let mainUrl = '';
            const baselineMap = {};
            try {
              if (fs.existsSync('.github/benchmark-baseline.json')) {
                const baselineData = JSON.parse(fs.readFileSync('.github/benchmark-baseline.json', 'utf8'));
                const entries = baselineData.entries && baselineData.entries.Benchmark ? baselineData.entries.Benchmark : [];
                
                // Find previous baseline from main
                let prevEntry = null;
                if (entries.length > 0) {
                  const last = entries[entries.length - 1];
                  if (last.commit && (last.commit.id === fullSha || last.commit.id.startsWith(shortSha))) {
                    if (entries.length >= 2) {
                      prevEntry = entries[entries.length - 2];
                    }
                  } else {
                    prevEntry = last;
                  }
                }

                if (prevEntry) {
                  if (prevEntry.commit && prevEntry.commit.id) {
                    mainSha = prevEntry.commit.id.substring(0, 7);
                    mainUrl = prevEntry.commit.url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${prevEntry.commit.id}`;
                  }
                  for (const b of (prevEntry.benches || [])) {
                    if (b.name.includes('- ns/op')) {
                      const suiteName = b.name.split(' ')[0];
                      baselineMap[suiteName] = `${b.value} ${b.unit}`;
                    }
                  }
                }
              }
            } catch (err) {
              console.log('Error reading baseline file:', err);
            }

            const lines = raw.split('\n');
            const rows = [];
            for (const line of lines) {
              const match = line.match(/^(Benchmark\S+)\s+(\d+)\s+([\d\.]+)\s+ns\/op(?:\s+(\d+)\s+B\/op\s+(\d+)\s+allocs\/op)?/);
              if (match) {
                const [, name, , nsOp, bOp, allocsOp] = match;
                const suiteName = name.replace(/-\d+$/, '');
                const currentVal = `${nsOp} ns/op`;
                const mainVal = baselineMap[suiteName] ? `${baselineMap[suiteName]}` : '-';
                rows.push(`| \`${suiteName}\` | \`${currentVal}\` | \`${mainVal}\` | \`${bOp !== undefined ? bOp + ' B/op' : '-'}\` | \`${allocsOp !== undefined ? allocsOp + ' allocs/op' : '-'}\` |`);
              }
            }

            const mainColHeader = mainSha 
              ? (mainUrl ? `main ([${mainSha}](${mainUrl})) (ns/op)` : `main (${mainSha}) (ns/op)`)
              : 'main (ns/op)';
            const tableHeader = `| Benchmark suite | Current: [${shortSha}](${commitUrl}) (ns/op) | ${mainColHeader} | Memory | Allocations |\n|---|---|---|---|---|`;
            const table = rows.length > 0 ? `${tableHeader}\n${rows.join('\n')}` : 'No benchmarks found.';
            const commentHeader = `## 🚀 **Benchmark Results (Commit: [\`${shortSha}\`](${commitUrl}))**\n\n`;
            const footer = `\n\n*Automatically generated by [Continuous Benchmark run](${runUrl}) for commit \`${shortSha}\`.*`;
            const details = `\n\n<details>\n<summary>🔍 Raw benchmark output</summary>\n\n\`\`\`text\n${raw}\n\`\`\`\n</details>`;
            const body = `${commentHeader}${table}${details}${footer}`;

            // 1. Post to GitHub Actions Job Summary tab
            await core.summary.addRaw(body).write();

            // 2. Check if this commit was from a merged PR -> post into PR conversation!
            try {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: fullSha,
              });

              if (prs.data && prs.data.length > 0) {
                const prNumber = prs.data[0].number;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: body,
                });
                console.log(`Successfully posted benchmark results to PR #${prNumber} conversation`);
              } else {
                // If push to branch without PR, post comment to the commit itself
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: fullSha,
                  body: body,
                });
                console.log(`Successfully posted benchmark results to commit ${shortSha}`);
              }
            } catch (err) {
              core.warning(`Could not post comment to PR/commit: ${err.message}`);
            }

      # 5. Commit and push updated baseline back to the branch with [skip ci]
      - name: Commit & push updated baseline
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/benchmark-baseline.json
          git diff --staged --quiet || (git commit -m "chore: update benchmark baseline [skip ci]" && git push)